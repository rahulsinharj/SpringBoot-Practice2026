spring:
  application:
    name: spring-boot-mongodb-advanced
  data:
    mongodb:
      uri: mongodb://localhost:27017/enterprise_mongodb?replicaSet=rs0
      auto-index-creation: false # Best practice in production: let custom index initializers control index lifecycle
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Real-time change stream configuration toggle
app:
  mongodb:
    change-stream:
      enabled: true
      collection-name: accounts

logging:
  level:
    root: INFO
    com.enterprise.mongodb: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
